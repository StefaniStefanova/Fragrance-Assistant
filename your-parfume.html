<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твоят парфюм</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="text-center">
    <header class="main-header">
      <div class="container nav-container">
        <h1 class="logo">
            <a href="index.html"><img src="images/droplet-icon.png" alt="Perfume-icon" class="logo-icon">Fragrance Assistant</a>
        </h1>

        <nav class="main-nav" id="main-nav">
            <ul>
                <li><a href="index.html">Начало</a></li>
                <li><a href="your-parfume.html">Започни отново</a></li>
            </ul>
        </nav>
    </div>
    </header>

    <main>
        <h3>Създай свой аромат</h3>
        <p>Избери по една нотка от всяка категория:</p>

        <div class="layout">
            <div class="left-panel">
                <div id="note-selection">
                <div class="note-category">
                    <h4>Връхна нотка</h4>
                    <div id="top-notes" class="note-options"></div>
                  </div>
              
                  <div class="note-category">
                    <h4>Средна нотка</h4>
                    <div id="heart-notes" class="note-options"></div>
                  </div>
              
                  <div class="note-category">
                    <h4>Базова нотка</h4>
                    <div id="base-notes" class="note-options"></div>
                  </div>
              
                  <button id="create-btn">Създай аромат</button>
                </div>
            </div>
        

        <div class="right-panel">
            <div id="custom-result" style="display:none;"></div>

             <!-- SVG бутилка -->
        <svg id="perfume-svg" viewBox="0 0 100 200" width="160">
            <defs>
              <!-- ClipPath за вътрешността на бутилката -->
              <clipPath id="bottle-clip">
                <path d="M20,40 
                         Q15,65 15,90 
                         L15,160 
                         Q15,180 30,180 
                         L70,180 
                         Q85,180 85,160 
                         L85,90 
                         Q85,65 80,40 
                         Z"/>
              </clipPath>
          
              <!-- Стъклен градиент -->
              <linearGradient id="glass-gradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="#e0e0e0" stop-opacity="0.2"/>
              </linearGradient>
          
              <!-- Контурен градиент -->
              <linearGradient id="outline-gradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#aaa"/>
                <stop offset="100%" stop-color="#666"/>
              </linearGradient>
            </defs>
          
            <!-- Капачка -->
            <rect x="35" y="20" width="30" height="15" rx="4" fill="#888" />
            <rect x="38" y="14" width="24" height="6" rx="3" fill="#aaa" />
          
            <!-- Слоеве за аромата вътре -->
            <g clip-path="url(#bottle-clip)">
              <rect id="base-layer" class="layer" x="15" y="170" width="70" height="0" fill="#de874d" />
              <rect id="heart-layer" class="layer" x="15" y="170" width="70" height="0" fill="#cc93ad" />
              <rect id="top-layer" class="layer" x="15" y="170" width="70" height="0" fill="#cce665" />
          
            <!-- Анимирани мехурчета -->
            <circle class="bubble" cx="40" cy="160" r="1.5"/>
            <circle class="bubble" cx="50" cy="150" r="1.2"/>
            <circle class="bubble" cx="60" cy="140" r="1.7"/>
            <circle class="bubble" cx="45" cy="130" r="1.3"/>
            <circle class="bubble" cx="55" cy="120" r="1.1"/>
            <circle class="bubble" cx="48" cy="110" r="1.4"/>

            </g>
          
            <!-- Стъклен ефект -->
            <path d="M20,40 
                     Q15,65 15,90 
                     L15,160 
                     Q15,180 30,180 
                     L70,180 
                     Q85,180 85,160 
                     L85,90 
                     Q85,65 80,40 
                     Z" fill="url(#glass-gradient)" />
          
            <!-- Контур -->
            <path d="M20,40 
                     Q15,65 15,90 
                     L15,160 
                     Q15,180 30,180 
                     L70,180 
                     Q85,180 85,160 
                     L85,90 
                     Q85,65 80,40 
                     Z" fill="none" stroke="url(#outline-gradient)" stroke-width="2" />
          </svg>
        </div>
    </div>
    </main>
      
    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2025 FragranceAssistant.<br>
                Всички права запазени.
        </p>
        </div>
    </footer>
    

    <script>
        const notesData = {
          top: ['bergamot', 'rose', 'lavender', 'coconut', 'cocoa', 'orange'],
          heart: ['peach', 'lemon', 'ginger', 'cinnamon', 'freesia', 'cherry'],
          base: ['vanilla', 'cedrus', 'sandal-wood', 'mint', 'honey', 'coffee']
        };
    
        const noteLabels = {
          bergamot: "Бергамот", rose: "Роза", lavender: "Лавандула", coconut:"Кокос", cocoa: "Какао", orange: "Портокал",
          peach:"Праскова", lemon: "Лимон", ginger: "Джинджифил", cinnamon:"Канела", freesia:"Фрезия", cherry: "Череша",
          vanilla: "Ванилия", cedrus: "Кедър", "sandal-wood": "Сандалово дърво", mint:"Мента", honey:"Мед", coffee: "Кафе"
        };
    
        function renderNotes(category, containerId) {
          const container = document.getElementById(containerId);
          notesData[category].forEach(note => {
            const btn = document.createElement('button');
            btn.className = 'note-option';
            btn.innerText = noteLabels[note];
            btn.dataset.note = note;
            btn.addEventListener('click', function () {
              document.querySelectorAll(`#${containerId} .note-option`).forEach(b => b.classList.remove('selected'));
              this.classList.add('selected');
            });
            container.appendChild(btn);
          });
        }
    
        renderNotes('top', 'top-notes');
        renderNotes('heart', 'heart-notes');
        renderNotes('base', 'base-notes');
    
        function renderNotes(category, containerId) {
  const container = document.getElementById(containerId);
  notesData[category].forEach(note => {
    const btn = document.createElement('button');
    btn.className = 'note-option';
    btn.innerText = noteLabels[note];
    btn.dataset.note = note;

    btn.addEventListener('click', function () {
      // Маркирай избраната нотка
      document.querySelectorAll(`#${containerId} .note-option`).forEach(b => b.classList.remove('selected'));
      this.classList.add('selected');

      // Оцвети съответния слой
      if (category === 'top') {
        document.getElementById('top-layer').setAttribute('height', 20);
        document.getElementById('top-layer').setAttribute('y', 150);
      } else if (category === 'heart') {
        document.getElementById('heart-layer').setAttribute('height', 40);
        document.getElementById('heart-layer').setAttribute('y', 110);
      } else if (category === 'base') {
        document.getElementById('base-layer').setAttribute('height', 50);
        document.getElementById('base-layer').setAttribute('y', 60);
      }
      
    });

    container.appendChild(btn);
  });
}

const fancyWords = ['Whisper', 'Mist', 'Velvet', 'Glow', 'Aura', 'Touch', 'Essence', 'Secret', 'Kiss'];

document.getElementById('create-btn').addEventListener('click', function () {
  const topSelected = document.querySelector('#top-notes .note-option.selected');
  const heartSelected = document.querySelector('#heart-notes .note-option.selected');
  const baseSelected = document.querySelector('#base-notes .note-option.selected');

  if (!topSelected || !heartSelected || !baseSelected) {
    alert("Моля, избери нотка от всяка категория.");
    return;
  }

  const topNote = topSelected.dataset.note;
  const heartNote = heartSelected.dataset.note;
  const baseNote = baseSelected.dataset.note;

  // Случайна от избраните 3 нотки (оригиналното име)
  const selectedNotes = [topNote, heartNote, baseNote];
  const randomNote = selectedNotes[Math.floor(Math.random() * selectedNotes.length)];

  const fancy = fancyWords[Math.floor(Math.random() * fancyWords.length)];
  const name = `${capitalize(randomNote)} ${fancy}`;


  const noteSection = document.getElementById('note-selection');
  const description = `Ароматът съчетава ${noteDescriptions[topNote]}, 
    ${noteDescriptions[heartNote]}, ${noteDescriptions[baseNote]} стил. 
    Подходящ е за хора, които обичат баланса между дързост и класика.`;
    noteSection.innerHTML = `
    <h3>Твоят аромат: <em>${name}</em></h3>
    <p><strong>Връхна нотка:</strong> ${noteLabels[topNote]}</p>
    <p><strong>Сърдечна нотка:</strong> ${noteLabels[heartNote]}</p>
    <p><strong>Базова нотка:</strong> ${noteLabels[baseNote]}</p>
     <p class="scent-description">${description}</p>
  `;
  resultDiv.style.display = 'block';

});

// Помощна функция за главна буква
function capitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

const noteDescriptions = {
  bergamot: "свеж и цитрусов",
  rose: "романтичен и флорален",
  lavender: "успокояващ и билков",
  coconut: "тропически и кремообразен",
  cocoa: "дълбок и сладък",
  orange: "сочен и жизнерадостен",
  peach: "плодов и сочен",
  lemon: "енергизиращ и кисел",
  ginger: "пикантен и топъл",
  cinnamon: "загряващ и сладко-пикантен",
  freesia: "свеж и цветен",
  cherry: "сладък и игрив",
  vanilla: "мек и уютен",
  cedrus: "дървесен и стабилен",
  "sandal-wood": "екзотичен и земен",
  mint: "хладен и освежаващ",
  honey: "топъл и нежен",
  coffee: "дълбок и стимулиращ"
};

</script>
    
    
</body>
</html>
